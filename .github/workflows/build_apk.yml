name: Build Roozmari Android & iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Clean Flutter Project
        run: |
          rm -rf android ios lib pubspec.yaml test
          flutter create . --org com.roozmari --project-name rawa_school_app --platforms=android,ios

      - name: Generate pubspec.yaml, AndroidManifest.xml and main.dart safely via Python
        run: |
          python3 - << 'PYEOF'
          import os

          pubspec_content = """name: rawa_school_app
          description: تطبيق مدارس روا الرسمي
          publish_to: 'none'
          version: 2.0.0+2

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.7.0
            webview_flutter_android: ^3.15.0
            webview_flutter_wkwebview: ^3.12.0
            shared_preferences: ^2.2.2
            http: ^1.2.0
            url_launcher: ^6.2.5

          flutter:
            uses-material-design: true
          """
          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write("\n".join([line[10:] if line.startswith("          ") else line for line in pubspec_content.splitlines()]))

          manifest_content = """<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>

              <application
                  android:label="مدارس روا"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          """
          with open("android/app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write("\n".join([line[10:] if line.startswith("          ") else line for line in manifest_content.splitlines()]))

          main_dart_content = """import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:http/http.dart' as http;
          import 'package:url_launcher/url_launcher.dart';

          const String BASE_DOMAIN = "https://rawa.roozmari.com";
          const String BRIDGE_API  = "$BASE_DOMAIN/api_mobile_bridge.php";

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Color(0xFF4A0E24),
              statusBarIconBrightness: Brightness.light,
            ));
            runApp(const RoozmariSchoolApp());
          }

          class RoozmariSchoolApp extends StatelessWidget {
            const RoozmariSchoolApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'مدارس روا',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  primaryColor: const Color(0xFFFF4D79),
                  scaffoldBackgroundColor: const Color(0xFF4A0E24),
                ),
                home: const RoozMainScreen(),
              );
            }
          }

          class RoozMainScreen extends StatefulWidget {
            const RoozMainScreen({super.key});

            @override
            State<RoozMainScreen> createState() => _RoozMainScreenState();
          }

          class _RoozMainScreenState extends State<RoozMainScreen> {
            late final WebViewController _controller;
            bool isLoading = true;
            bool hasError = false;
            int loadProgress = 15;

            @override
            void initState() {
              super.initState();
              _initWebView();
            }

            void _initWebView() {
              final WebViewController controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF4A0E24))
                ..setUserAgent("Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36 RoozmariMobileApp/2.0")
                ..addJavaScriptChannel(
                  'RoozFlutterBridge',
                  onMessageReceived: (JavaScriptMessage message) {
                    _handleBridgeMessage(message.message);
                  },
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (String url) {
                      if (mounted) {
                        setState(() {
                          isLoading = true;
                          hasError = false;
                        });
                      }
                    },
                    onProgress: (int progress) {
                      if (mounted) {
                        setState(() {
                          loadProgress = progress;
                          if (progress >= 75) {
                            isLoading = false;
                          }
                        });
                      }
                    },
                    onPageFinished: (String url) async {
                      if (mounted) {
                        setState(() {
                          isLoading = false;
                        });
                      }
                      if (!url.contains('/login')) {
                        final prefs = await SharedPreferences.getInstance();
                        await prefs.setString('rooz_last_url', url);
                      }
                    },
                    onWebResourceError: (WebResourceError error) {
                      if (error.isForMainFrame == true && mounted) {
                        setState(() {
                          isLoading = false;
                        });
                      }
                    },
                    onNavigationRequest: (NavigationRequest request) async {
                      final url = request.url;
                      if (url.contains("whatsapp") || url.startsWith("tel:") || url.startsWith("mailto:") || url.endsWith(".apk") || url.endsWith(".pdf")) {
                        final uri = Uri.parse(url);
                        await launchUrl(uri, mode: LaunchMode.externalApplication);
                        return NavigationDecision.prevent;
                      }
                      return NavigationDecision.navigate;
                    },
                  ),
                )
                ..loadRequest(Uri.parse("$BASE_DOMAIN/login?app_mode=1"));

              if (controller.platform is AndroidWebViewController) {
                AndroidWebViewController.enableDebugging(false);
                (controller.platform as AndroidWebViewController)
                  ..setMediaPlaybackRequiresUserGesture(false)
                  ..setOnPlatformPermissionRequest((PlatformWebViewPermissionRequest request) {
                    request.grant();
                  });
              }

              _controller = controller;
              _restoreSavedSessionIfAny();
            }

            Future<void> _restoreSavedSessionIfAny() async {
              try {
                final prefs = await SharedPreferences.getInstance();
                final lastUrl = prefs.getString('rooz_last_url') ?? '';
                if (lastUrl.isNotEmpty && !lastUrl.contains('/login')) {
                  final target = lastUrl.startsWith('http') ? lastUrl : "$BASE_DOMAIN$lastUrl";
                  _controller.loadRequest(Uri.parse(target));
                }
              } catch (_) {}
            }

            Future<void> _handleBridgeMessage(String rawJson) async {
              try {
                final Map<String, dynamic> msg = jsonDecode(rawJson);
                if (msg['event'] == 'USER_LOGGED_IN') {
                  final role = msg['role'] ?? 'student';
                  final userKey = msg['user_key'] ?? '';
                  final currentUrl = msg['current_url'] ?? '';
                  if (userKey.toString().isNotEmpty) {
                    final prefs = await SharedPreferences.getInstance();
                    await prefs.setString('rooz_user_role', role.toString());
                    await prefs.setString('rooz_user_key', userKey.toString());
                    if (currentUrl.toString().isNotEmpty) {
                      await prefs.setString('rooz_last_url', currentUrl.toString());
                    }
                    await http.post(Uri.parse("$BRIDGE_API?bridge_action=register_device"), body: {
                      'user_role': role.toString(),
                      'user_key': userKey.toString(),
                      'platform': 'flutter_app',
                      'fcm_token': 'ACTIVE_APP_V2',
                    });
                  }
                } else if (msg['event'] == 'USER_LOGGED_OUT') {
                  final prefs = await SharedPreferences.getInstance();
                  await prefs.remove('rooz_last_url');
                  await prefs.remove('rooz_user_key');
                }
              } catch (_) {}
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvoked: (didPop) async {
                  if (didPop) return;
                  if (await _controller.canGoBack()) {
                    await _controller.goBack();
                  }
                },
                child: Scaffold(
                  backgroundColor: const Color(0xFF4A0E24),
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: _controller),
                        if (isLoading)
                          Positioned(
                            top: 0,
                            left: 0,
                            right: 0,
                            child: LinearProgressIndicator(
                              value: loadProgress / 100.0,
                              backgroundColor: const Color(0xFF4A0E24),
                              color: const Color(0xFFFF4D79),
                              minHeight: 4,
                            ),
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          """
          os.makedirs("lib", exist_ok=True)
          with open("lib/main.dart", "w", encoding="utf-8") as f:
              f.write("\n".join([line[10:] if line.startswith("          ") else line for line in main_dart_content.splitlines()]))
          PYEOF

      - name: Build Clean APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Clean APK v2
        uses: actions/upload-artifact@v4
        with:
          name: roozmari-clean-apk-v2
          path: build/app/outputs/flutter-apk/app-release.apk

  build_ios_simulator:
    name: Build iOS App for Appetize Simulator
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter on macOS
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Clean iOS Flutter Project
        run: |
          rm -rf android ios lib pubspec.yaml test
          flutter create . --org com.roozmari --project-name rawa_school_app --platforms=ios

      - name: Generate iOS Code via Python
        run: |
          python3 - << 'PYEOF'
          import os

          pubspec_content = """name: rawa_school_app
          description: تطبيق مدارس روا الرسمي
          publish_to: 'none'
          version: 2.0.0+2

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.7.0
            shared_preferences: ^2.2.2
            http: ^1.2.0
            url_launcher: ^6.2.5

          flutter:
            uses-material-design: true
          """
          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write("\n".join([line[10:] if line.startswith("          ") else line for line in pubspec_content.splitlines()]))

          main_dart_content = """import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: RoozIosScreen(),
            ));
          }

          class RoozIosScreen extends StatefulWidget {
            const RoozIosScreen({super.key});
            @override
            State<RoozIosScreen> createState() => _RoozIosScreenState();
          }

          class _RoozIosScreenState extends State<RoozIosScreen> {
            late final WebViewController _controller;
            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse("https://rawa.roozmari.com/login?app_mode=1"));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF4A0E24),
                body: SafeArea(child: WebViewWidget(controller: _controller)),
              );
            }
          }
          """
          os.makedirs("lib", exist_ok=True)
          with open("lib/main.dart", "w", encoding="utf-8") as f:
              f.write("\n".join([line[10:] if line.startswith("          ") else line for line in main_dart_content.splitlines()]))
          PYEOF

      - name: Build iOS Simulator Bundle (.app)
        run: |
          flutter pub get
          flutter build ios --simulator
          cd build/ios/iphonesimulator
          zip -r roozmari_ios_simulator.zip Runner.app

      - name: Upload iOS Simulator Artifact for Appetize
        uses: actions/upload-artifact@v4
        with:
          name: roozmari-ios-simulator-zip
          path: build/ios/iphonesimulator/roozmari_ios_simulator.zip
